[package]
name = "zalo-tg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zalo-tg"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[build-dependencies]
tauri-build = { version = "2", features = [] }
